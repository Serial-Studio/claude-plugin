name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bridge-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  bridge-copy:
    # bridge.py and the Serial Studio repository's example are the same file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare with the MCP Client example
        run: |
          curl -fsSL -o upstream.py \
            "https://raw.githubusercontent.com/Serial-Studio/Serial-Studio/master/examples/MCP%20Client/claude_desktop_bridge.py"
          cmp upstream.py bridge.py

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npx -y @anthropic-ai/claude-code plugin validate .
